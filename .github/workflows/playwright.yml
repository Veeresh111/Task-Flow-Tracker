name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_CEO_NAME: ${{ secrets.VITE_CEO_NAME }}
  TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
  TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: flowtracker/package-lock.json

      - name: Install dependencies
        working-directory: flowtracker
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: flowtracker
        run: npx playwright install chromium

      - name: Create .env file
        working-directory: flowtracker
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_CEO_NAME=${{ secrets.VITE_CEO_NAME }}" >> .env
          echo "TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}" >> .env.test
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env.test

      - name: Run unit tests
        working-directory: flowtracker
        run: npm test

      - name: Start Vite dev server
        working-directory: flowtracker
        run: npm run dev &

      - name: Wait for dev server
        working-directory: flowtracker
        run: |
          npx wait-on http://localhost:8080 --timeout 30000

      - name: Run Playwright tests
        working-directory: flowtracker
        run: npx playwright test --reporter=list,json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            flowtracker/test-results/
            flowtracker/playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: flowtracker/test-results/**/*.png
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: flowtracker/test-results/**/*.zip
          retention-days: 7
